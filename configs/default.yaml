# Default configuration for recipe generation system

# Model configuration
model:
  model_name: "gpt2"
  learning_rate: 5e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_length: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

# Training configuration
training:
  max_epochs: 10
  batch_size: 8
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  precision: "16-mixed"  # or "32" for CPU
  accelerator: "auto"
  devices: 1
  
# Data configuration
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_length: 512
  batch_size: 8
  num_workers: 2
  pin_memory: true

# Logging configuration
logging:
  type: "tensorboard"  # or "wandb"
  project: "recipe-generation"
  name: "recipe-model"
  log_dir: "./logs"

# Output configuration
output:
  checkpoint_dir: "./checkpoints"
  sample_dir: "./assets/samples"
  model_dir: "./models"
  
# Evaluation configuration
evaluation:
  compute_bert_score: true
  save_plots: true
  plot_dir: "./assets/plots"
  
# Sampling configuration
sampling:
  num_samples: 5
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  max_length: 300
  sampling_strategy: "nucleus"  # "greedy", "nucleus", "top_k", "random"

# Reproducibility
seed: 42
deterministic: true
